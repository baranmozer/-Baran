<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Transfer Radar - YouTube İçerik Platformu</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Preload Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-layout">
    
    <!-- Mobile Sidebar Toggle -->
    <button class="sidebar-toggle" id="sidebar-toggle">
      <span>☰</span>
    </button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">TR</div>
        <div class="brand-text">
          <span class="brand-name">Transfer Radar</span>
          <span class="brand-sub">YouTube Studio</span>
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <div class="nav-section-title">İçerik Üretimi</div>
        <a class="nav-item active" data-route="dashboard" onclick="App.navigate('dashboard')">
          <span class="nav-icon">🎬</span> İçerik Merkezi
        </a>
        <a class="nav-item" data-route="add-rumor" onclick="App.navigate('add-rumor')">
          <span class="nav-icon">📰</span> Haber Ekle
        </a>
        <a class="nav-item" data-route="players" onclick="App.navigate('players')">
          <span class="nav-icon">👤</span> Futbolcu Ara
        </a>
        
        <div class="nav-section-title mt-16">Video Araçları</div>
        <a class="nav-item" data-route="script" onclick="App.navigate('script')">
          <span class="nav-icon">📝</span> Senaryo Yaz
        </a>
        <a class="nav-item" data-route="thumbnail" onclick="App.navigate('thumbnail')">
          <span class="nav-icon">🎨</span> Thumbnail Yap
        </a>
        
        <div class="nav-section-title mt-16">Sistem</div>
        <a class="nav-item" data-route="sources" onclick="App.navigate('sources')">
          <span class="nav-icon">📋</span> Kaynaklar
        </a>
        <a class="nav-item" data-route="settings" onclick="App.navigate('settings')">
          <span class="nav-icon">⚙️</span> Ayarlar
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <div class="version">Transfer Radar v1.0 • $0 Cost</div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="page-container" id="main-content-area">
        <!-- Content gets injected here by app.js -->
      </div>
    </main>

  </div>

  <!-- Global Containers -->
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-overlay" class="modal-overlay"></div>

  <!-- JS Modules -->
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/script-generator.js"></script>
  <script src="js/thumbnail.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
