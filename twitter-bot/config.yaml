accounts:
  galatasaray:
    team_name: "Galatasaray"
    env_prefix: "GS"  # .env'deki anahtar prefxi: GS_API_KEY, GS_API_SECRET, ...
    keywords:
      - "Galatasaray"
      - "Cimbom"
      - "GS"
      - "Galatasaray basketbol"
    rss_feeds:
      - "https://www.galatasaray.org/rss"
      - "https://www.fanatik.com.tr/rss/galatasaray"
      - "https://www.hurriyet.com.tr/rss/spor-galatasaray"
    news_urls:
      - "https://www.galatasaray.org/haberler"
    hashtags:
      - "#Galatasaray"
      - "#Cimbom"
      - "#GS"
    schedule_hours:
      - "08:00"
      - "10:00"
      - "12:00"
      - "14:00"
      - "16:00"
      - "18:00"
      - "20:00"
      - "22:00"

  fenerbahce:
    team_name: "Fenerbahçe"
    env_prefix: "FB"
    keywords:
      - "Fenerbahçe"
      - "Fenerbahce"
      - "FB"
      - "Fenerbahçe basketbol"
    rss_feeds:
      - "https://www.fenerbahce.org/rss"
      - "https://www.fanatik.com.tr/rss/fenerbahce"
      - "https://www.hurriyet.com.tr/rss/spor-fenerbahce"
    news_urls:
      - "https://www.fenerbahce.org/haberler"
    hashtags:
      - "#Fenerbahçe"
      - "#FB"
      - "#Fenerbahce"
    schedule_hours:
      - "08:30"
      - "10:30"
      - "12:30"
      - "14:30"
      - "16:30"
      - "18:30"
      - "20:30"
      - "22:30"

settings:
  max_tweets_per_day: 20
  dedup_hours: 48
  request_delay_seconds: 2
  dry_run: true
  draft_dir: "drafts"
  db_path: "db/news.db"
  log_path: "logs/bot.log"
